# SonarCloud project configuration.
#
# Setup (one-time, done by a repo admin at sonarcloud.io, not by CI):
#   1. Sign in to https://sonarcloud.io with GitHub and import this repository.
#   2. SonarCloud shows the exact organization key and project key on the
#      project's Administration > General Settings page - replace the two
#      placeholders below with those exact values.
#   3. Generate a token (My Account > Security) and add it as a repository
#      secret named SONAR_TOKEN (repo Settings > Secrets and variables >
#      Actions). Until that secret exists, the CI workflow's SonarCloud step
#      is skipped rather than failing the build.
sonar.organization=your-sonarcloud-org-key
sonar.projectKey=your-sonarcloud-project-key

sonar.projectName=Enterprise Collaboration Platform - API
sonar.sourceEncoding=UTF-8

# Scoped to the graded capstone deliverable (apps/api). apps/web is a thin
# support client for the demo walkthrough, not part of the backend rubric.
sonar.sources=apps/api/src
sonar.tests=apps/api/src,apps/api/test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts
# Declarative/boilerplate files skew coverage % without reflecting real risk -
# excluded from the coverage metric only, still analyzed for bugs/smells.
sonar.coverage.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/main.ts,**/*.module.ts,**/*.dto.ts,**/*.interface.ts,**/*.enum.ts

sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
