version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecp_user
      POSTGRES_PASSWORD: ecp_password
      POSTGRES_DB: ecp_db
    ports:
      - "5433:5432"
    volumes:
      - ecp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecp_user -d ecp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      # The Dockerfile builds from the monorepo root (needs the root
      # package-lock.json for npm ci), so context points two levels up even
      # though this compose file lives in apps/api.
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: ecp-api
    restart: unless-stopped
    command: npm run start:dev
    env_file:
      - .env
    environment:
      # .env points at localhost:5433/localhost:6379 for host-side tooling
      # (prisma migrate, local test runs); from inside this container those
      # must resolve to the compose service names instead.
      DATABASE_URL: postgresql://ecp_user:ecp_password@postgres:5432/ecp_db?schema=public
      REDIS_HOST: redis
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./src:/repo/apps/api/src
      - ./prisma:/repo/apps/api/prisma

volumes:
  ecp_postgres_data:
