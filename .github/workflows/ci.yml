name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 # 16-alpine
        env:
          POSTGRES_USER: ecp_user
          POSTGRES_PASSWORD: ecp_password
          POSTGRES_DB: ecp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecp_user -d ecp_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf # 7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ecp_user:ecp_password@localhost:5432/ecp_db?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-real-use
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-real-use
      JWT_REFRESH_EXPIRES_IN: 7d
      PASSWORD_RESET_TOKEN_TTL_MINUTES: 30
      FRONTEND_URL: http://localhost:5173
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 1000
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_SECURE: false
      SMTP_FROM: "ECP Platform <no-reply@ecp.local>"
      DAILY_REMINDER_CRON: "0 8 * * *"
      WEEKLY_SUMMARY_CRON: "0 8 * * 1"
      UPLOAD_MAX_SIZE_MB: 10
      UPLOAD_DIR: uploads
      PORT: 3000
      API_PREFIX: api/v1
      # Job-level so step `if:` conditions can read it via env.SONAR_TOKEN -
      # the secrets context isn't a valid named-value inside an `if:` expression.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # SonarCloud's analysis (new-code detection, SCM blame) needs full
          # history, not the default shallow clone.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:deploy -w apps/api

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test:cov

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: SonarCloud Scan
        # Skipped until a SONAR_TOKEN repo secret exists (see sonar-project.properties)
        # so setup order never turns CI red.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
